<!doctype html><html lang="en"><meta charset="utf-8"><title>HWS image upload checks</title><style>body{font:16px system-ui;max-width:860px;margin:40px auto;background:#f6f7fb;color:#17243a}button{padding:12px 20px;background:#264e91;color:white;border:0;border-radius:8px}li{margin:10px 0}img{max-width:320px;border:1px solid #bbc;background:repeating-conic-gradient(#eee 0% 25%,white 0% 50%) 0/20px 20px}pre{white-space:pre-wrap}</style><h1>Image upload checks</h1><p>Tests the real browser image decoder and encoder. No files are sent to a server.</p><button id="run">Run image checks</button><ol id="results"></ol><div id="preview"></div><pre id="summary"></pre><script type="module">
import {prepareImageUpload} from '../lib/image-upload.ts';
import {MAX_MEDIA_BYTES,validateMedia} from '../lib/media-policy.ts';
const results=document.querySelector('#results'),summary=document.querySelector('#summary');
const assert=(ok,message)=>{if(!ok)throw new Error(message)};
const pass=message=>{const item=document.createElement('li');item.textContent='PASS '+message;results.append(item)};
const blob=(canvas,type='image/png')=>new Promise(resolve=>canvas.toBlob(resolve,type));
const padded=(source,type,name)=>new File([source,new Uint8Array(MAX_MEDIA_BYTES+1-source.size)],name,{type});
const decode=file=>new Promise((resolve,reject)=>{const image=new Image();const url=URL.createObjectURL(file);image.onload=()=>{URL.revokeObjectURL(url);resolve(image)};image.onerror=reject;image.src=url});
document.querySelector('#run').onclick=async()=>{
 document.querySelector('#run').disabled=true;results.replaceChildren();summary.textContent='Running…';
 try{
 const canvas=document.createElement('canvas');canvas.width=1024;canvas.height=512;const ctx=canvas.getContext('2d');ctx.fillStyle='#284e92';ctx.fillRect(100,50,800,400);ctx.fillStyle='white';ctx.font='60px sans-serif';ctx.fillText('HWS image upload',180,270);
 const source=await blob(canvas);const small=new File([source],'small.png',{type:'image/png'});
 assert(await prepareImageUpload(small)===small,'Small file changed');pass('Images already under 50 MB remain unchanged');
 let optimized=0;const large=padded(source,'image/png','oversized.png');const prepared=await prepareImageUpload(large,{onOptimize:()=>optimized++});
 assert(optimized===1&&prepared.size<=MAX_MEDIA_BYTES&&prepared.size>0,'Invalid optimized size');assert(prepared.type==='image/webp'||prepared.type==='image/png','Transparency format lost');pass(`Oversized PNG reduced from ${(large.size/1024/1024).toFixed(1)} MB to ${(prepared.size/1024).toFixed(1)} KB`);
 const image=await decode(prepared);assert(image.naturalWidth===1024&&image.naturalHeight===512,'Aspect ratio changed');ctx.clearRect(0,0,1024,512);ctx.drawImage(image,0,0);assert(ctx.getImageData(0,0,1,1).data[3]===0,'Transparency lost');pass('Aspect ratio and transparent pixels preserved');document.querySelector('#preview').append(image);
 const jpeg=await blob(canvas,'image/jpeg');const jpgResult=await prepareImageUpload(padded(jpeg,'image/jpeg','large.jpeg'));assert(jpgResult.type==='image/jpeg'&&jpgResult.name.endsWith('.jpg'),'JPEG filename/MIME mismatch');pass('JPEG output has a matching file extension and MIME type');
 const wide=document.createElement('canvas');wide.width=10000;wide.height=16;const wideResult=await prepareImageUpload(padded(await blob(wide),'image/png','wide.png'));const wideImage=await decode(wideResult);assert(wideImage.naturalWidth===8192&&wideImage.naturalHeight===13,'Dimension cap failed');pass('Extreme dimensions resize proportionally');
 const cancelled=new AbortController();cancelled.abort();try{await prepareImageUpload(large,{signal:cancelled.signal});throw new Error('Accepted cancelled image')}catch(error){assert(error.name==='AbortError','Wrong cancellation error')}pass('Cancelled optimization cannot continue to upload');
 const mid=new AbortController();try{await prepareImageUpload(large,{signal:mid.signal,onOptimize:()=>mid.abort()});throw new Error('Ignored cancellation')}catch(error){assert(error.name==='AbortError','Wrong cancellation error')}pass('Cancellation while preparing stops the conversion');
 const gif=new File([new Uint8Array(MAX_MEDIA_BYTES+1)],'animated.gif',{type:'image/gif'});let asked=0;try{await prepareImageUpload(gif,{confirmStill:()=>{asked++;return false}});throw new Error('Animation silently flattened')}catch(error){assert(asked===1&&error.message.includes('kept unchanged'),'Animation consent missing')}pass('Oversized animations are never silently flattened');
 const bad=new File([new Uint8Array(MAX_MEDIA_BYTES+1)],'broken.jpg',{type:'image/jpeg'});try{await prepareImageUpload(bad);throw new Error('Corrupt image accepted')}catch(error){assert(error.message.includes('could not be opened'),'Unhelpful decoding error')}pass('Corrupt images show a useful conversion error');
 const video=new File([new Uint8Array(MAX_MEDIA_BYTES+1)],'video.mp4',{type:'video/mp4'});assert(await prepareImageUpload(video)===video&&!!validateMedia(video.size,video.type),'Video unexpectedly converted');pass('Oversized videos retain a clear 50 MB limit');
 summary.textContent='Testing a genuinely oversized image…';const noise=document.createElement('canvas');noise.width=4096;noise.height=4096;const noiseContext=noise.getContext('2d');const pixels=noiseContext.createImageData(4096,4096);let seed=729;for(let i=0;i<pixels.data.length;i++){seed=(Math.imul(seed,1664525)+1013904223)|0;pixels.data[i]=seed>>>24;}noiseContext.putImageData(pixels,0,0);const real=await blob(noise);assert(real.size>MAX_MEDIA_BYTES,'Fixture did not exceed limit');const reduced=await prepareImageUpload(new File([real],'large-photo.png',{type:'image/png'}));assert(reduced.size<=MAX_MEDIA_BYTES,'Real image too large');const reducedImage=await decode(reduced);assert(reducedImage.naturalWidth===4000&&reducedImage.naturalHeight===4000,'Pixel cap failed');pass(`Real ${(real.size/1024/1024).toFixed(1)} MB PNG reduced to ${(reduced.size/1024/1024).toFixed(1)} MB at 4000 × 4000`);noise.width=noise.height=1;
 summary.textContent=`All ${results.children.length} image checks passed.`;
 }catch(error){summary.textContent='FAIL '+error.message;console.error(error)}finally{document.querySelector('#run').disabled=false}
};
</script></html>
